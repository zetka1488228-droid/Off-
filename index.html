<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vape Off | Магазин</title>
    <!-- Подключаем скрипт Telegram Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* --- БАЗОВЫЕ СТИЛИ (Черный/Белый/Фиолетовый) --- */
        :root {
            --bg-color: #0f0f13;
            --card-bg: #1a1a24;
            --text-main: #ffffff;
            --text-muted: #8e8e9f;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 70px; /* Отступ для нижнего меню */
            overflow-x: hidden;
        }

        /* --- ШАПКА --- */
        .header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-size: 22px; font-weight: 800; }
        .logo span { color: var(--accent); }

        /* --- ПОИСК --- */
        .search-container { padding: 0 20px 15px 20px; }
        .search-input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 12px 15px;
            color: white;
            font-size: 16px;
            outline: none;
        }
        .search-input:focus { border-color: var(--accent); }

        /* --- КАТЕГОРИИ --- */
        .categories {
            display: flex;
            gap: 10px;
            padding: 0 20px 20px 20px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .categories::-webkit-scrollbar { display: none; }
        .category-btn {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid #333;
            padding: 10px 18px;
            border-radius: 20px;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 500;
        }
        .category-btn.active {
            background: var(--accent);
            border-color: var(--accent);
        }

        /* --- СЕТКА ТОВАРОВ --- */
        .products-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 0 20px;
        }
        .product-card {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .product-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: #222; /* Заглушка, если нет картинки */
        }
        .product-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--accent);
            color: white;
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 8px;
            font-weight: bold;
        }
        .product-info { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; line-height: 1.3; }
        .product-price {
            margin-top: auto;
            font-size: 16px;
            font-weight: 800;
            color: white;
            background: var(--accent);
            display: inline-block;
            padding: 6px 12px;
            border-radius: 10px;
            align-self: flex-start;
        }

        /* --- НИЖНЕЕ МЕНЮ --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid #333;
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
        }
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 20px; margin-bottom: 4px; }

        /* --- СКРЫТЫЕ ЭКРАНЫ --- */
        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body>

    <!-- ШАПКА -->
    <div class="header">
        <div class="logo">VAPE <span>OFF</span></div>
        <div id="user-name" style="font-size: 14px; color: var(--text-muted);"></div>
    </div>

    <!-- ГЛАВНАЯ СТРАНИЦА (ВИТРИНА) -->
    <div id="page-catalog" class="page active">
        <div class="search-container">
            <input type="text" class="search-input" placeholder="Поиск товаров...">
        </div>

        <div class="categories">
            <button class="category-btn active">Все</button>
            <button class="category-btn">Жидкости</button>
            <button class="category-btn">Испарители</button>
            <button class="category-btn">Расходники</button>
        </div>

        <div class="products-grid">
            <!-- ТОВАР 1 -->
            <div class="product-card">
                <div class="product-badge">ЖИДКОСТИ</div>
                <!-- Вставь сюда ссылку на картинку товара вместо заглушки -->
                <img src="https://via.placeholder.com/300x300/1a1a24/8b5cf6?text=Rick+and+Morty" class="product-img" alt="Товар">
                <div class="product-info">
                    <div class="product-title">Rick and Morty BAD TRIP</div>
                    <div class="product-price">17 Br</div>
                </div>
            </div>
            
            <!-- ТОВАР 2 -->
            <div class="product-card">
                <div class="product-badge">ЖИДКОСТИ</div>
                <img src="https://via.placeholder.com/300x300/1a1a24/8b5cf6?text=Monashka" class="product-img" alt="Товар">
                <div class="product-info">
                    <div class="product-title">Монашка x HOTSPOT</div>
                    <div class="product-price">17 Br</div>
                </div>
            </div>
            
            <!-- ТОВАР 3 -->
            <div class="product-card">
                <div class="product-badge">НИКОБУСТЕРЫ</div>
                <img src="https://via.placeholder.com/300x300/1a1a24/8b5cf6?text=Nikobuster" class="product-img" alt="Товар">
                <div class="product-info">
                    <div class="product-title">Никобустер 20%</div>
                    <div class="product-price">5 Br</div>
                </div>
            </div>
            
            <!-- ТОВАР 4 -->
            <div class="product-card">
                <div class="product-badge">ЖИДКОСТИ</div>
                <img src="https://via.placeholder.com/300x300/1a1a24/8b5cf6?text=CATCWILL" class="product-img" alt="Товар">
                <div class="product-info">
                    <div class="product-title">Rick and Morty x CATCWILL</div>
                    <div class="product-price">20 Br</div>
                </div>
            </div>
        </div>
    </div>

    <!-- СТРАНИЦА КОРЗИНЫ (Пока пустая) -->
    <div id="page-cart" class="page">
        <div class="header"><div class="logo">Корзина</div></div>
        <div style="text-align: center; color: var(--text-muted); margin-top: 50px;">
            Тут пока пусто...<br>Добавьте товары из каталога.
        </div>
    </div>

    <!-- СТРАНИЦА ПРОФИЛЯ -->
    <div id="page-profile" class="page">
        <div class="header"><div class="logo">Профиль</div></div>
        <div style="padding: 20px; text-align: center;">
            <div style="width: 80px; height: 80px; background: var(--accent); border-radius: 50%; margin: 0 auto 15px auto; display: flex; align-items: center; justify-content: center; font-size: 30px;">
                👤
            </div>
            <h2 id="profile-name" style="margin-bottom: 5px;">Загрузка...</h2>
            <p id="profile-id" style="color: var(--text-muted); font-size: 14px;"></p>
        </div>
    </div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('catalog', this)">
            <div class="nav-icon">🛍️</div>
            <div>Ассортимент</div>
        </div>
        <div class="nav-item" onclick="switchTab('cart', this)">
            <div class="nav-icon">🛒</div>
            <div>Корзина</div>
        </div>
        <div class="nav-item" onclick="switchTab('profile', this)">
            <div class="nav-icon">👤</div>
            <div>Профиль</div>
        </div>
    </div>

    <!-- ЛОГИКА (JavaScript) -->
    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть на весь экран
        tg.setHeaderColor('#0f0f13'); // Цвет шапки под наш фон

        // Получаем данные пользователя из Telegram
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-name').innerText = user.first_name;
            document.getElementById('profile-name').innerText = user.first_name + (user.last_name ? ' ' + user.last_name : '');
            document.getElementById('profile-id').innerText = '@' + (user.username || 'нет_юзернейма');
        } else {
            // Если открыто не в Telegram (для теста в браузере)
            document.getElementById('user-name').innerText = 'Гость';
            document.getElementById('profile-name').innerText = 'Гость';
            document.getElementById('profile-id').innerText = '@guest';
        }

        // Функция переключения вкладок
        function switchTab(tabId, element) {
            // Скрываем все страницы
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            // Показываем нужную
            document.getElementById('page-' + tabId).classList.add('active');

            // Меняем активную кнопку в меню
            document.querySelectorAll('.nav-item').forEach(nav => {
                nav.classList.remove('active');
            });
            element.classList.add('active');
        }
    </script>
</body>
              </html>
